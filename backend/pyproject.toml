[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these calls to declare parameter/dependency metadata.
extend-immutable-calls = [
	"fastapi.Body",
	"fastapi.Depends",
	"fastapi.File",
	"fastapi.Form",
	"fastapi.Query",
]
