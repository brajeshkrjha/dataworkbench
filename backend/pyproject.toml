[project]
name = "dataworkbench-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"pydantic>=2.10",
	"pydantic-settings>=2.6",
	"python-multipart>=0.0.9",
	"pyarrow>=18.0",
	"pandas>=2.2",
	"openpyxl>=3.1",
	"xlrd>=2.0",
	"fastavro>=1.9",
	"pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these calls to declare parameter/dependency metadata.
extend-immutable-calls = [
	"fastapi.Body",
	"fastapi.Depends",
	"fastapi.File",
	"fastapi.Form",
	"fastapi.Query",
]
